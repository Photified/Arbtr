<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arbtr</title>
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --primary-light: #f87171;
            --bg: #1a1a1a;
            --card-bg: #262626;
            --text: #ffffff;
            --text-muted: #9ca3af;
            --coin-gold: #ffffff;
            --coin-silver: #6b7280;
            --success: #ef4444;
            --border: #404040;
            /* Safe area variables for iPhone X+ */
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: var(--text);
            
            /* DESKTOP DEFAULTS */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- MOBILE LAYOUT OVERRIDE --- */
        @media (max-width: 480px) {
            html, body {
                height: 100%;
                width: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden; /* Stop page scroll */
            }

            body {
                display: block; /* Reset flex centering */
            }

            .app-card {
                max-width: 100%;
                border-radius: 0;
                border: none;
                box-shadow: none;
                
                /* CRITICAL FIX: Use dvh to fit visible screen exactly */
                height: 100vh; /* Fallback */
                height: 100dvh; 
            }
        }

        header {
            background: #1a1a1a;
            border-bottom: 1px solid var(--border);
            padding: 20px 24px;
            text-align: center;
            flex-shrink: 0; /* Never shrink */
            padding-top: max(20px, var(--sat)); /* Respect notch */
        }

        header img {
            height: 32px;
            width: auto;
            display: block;
            margin: 0 auto;
        }

        main {
            padding: 24px;
            position: relative;
            flex: 1; /* Take all available space */
            overflow-y: auto; /* Internal scroll only */
            -webkit-overflow-scrolling: touch;
        }

        /* VIEW TRANSITIONS */
        .view {
            display: none;
            animation: fadeIn 0.3s ease-in;
            height: 100%; /* Fill main */
        }

        .view.active-view {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* COIN STYLES */
        .coin-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            min-height: 200px;
        }

        .coin {
            position: relative;
            width: 150px;
            height: 150px;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.5rem;
            font-weight: bold;
            backface-visibility: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .heads { background: #ffffff; border: 6px solid #e5e5e5; color: #000000; }
        .tails { background: #404040; border: 6px solid #262626; transform: rotateX(180deg); color: #ffffff; }

        /* DICE STYLES */
        .scene {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            min-height: 200px;
        }

        .cube {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #ffffff;
            border: 3px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #000000;
            border-radius: 12px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.1);
        }

        .front  { transform: rotateY(0deg) translateZ(50px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .right  { transform: rotateY(90deg) translateZ(50px); }
        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .top    { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }

        /* LIST STYLES */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .text-input {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .add-btn {
            padding: 0 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
        }

        .list-area {
            flex: 1; /* Grow to fill space */
            overflow-y: auto; /* Internal list scroll */
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .list-item, .rank-item {
            background: var(--bg);
            padding: 12px;
            margin: 6px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            animation: slideIn 0.2s ease-out;
            border: 2px solid transparent;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* HIGHLIGHTS */
        .list-item.highlight {
            background: var(--primary);
            transform: scale(1.02);
        }

        .list-item.winner {
            background: var(--success);
            border-color: #16a34a;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .rank-number {
            background: var(--primary);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            margin-right: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            padding: 4px 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        /* STATUS & ACTION ZONE */
        .status {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            margin: 10px 0;
            min-height: 24px;
            flex-shrink: 0;
        }
        
        .status.loading { color: var(--primary-light); }

        .action-zone {
            padding: 0 24px 16px;
            flex-shrink: 0;
        }

        #main-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            border: none;
            border-radius: 14px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        #main-btn:disabled { opacity: 0.6; }

        /* NAV */
        nav {
            display: flex;
            background: var(--bg);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            flex: 1;
            padding: 16px 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            position: relative;
        }

        .nav-item.active { color: var(--primary); }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
        }

        /* INSTALL MODAL */
        .install-modal {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .install-content { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .install-icon img { width: 40px; border-radius: 8px; }
        .install-text h3 { font-size: 16px; color: var(--text); margin-bottom: 2px; }
        .install-text p { font-size: 13px; color: var(--text-muted); }
        .install-actions { display: flex; gap: 10px; }
        .install-actions button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .install-btn-primary { background: var(--primary); color: white; border: none; }
        .install-btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="app-card">
        <header>
            <img src="images/arbtrlogo.png" alt="Arbtr">
        </header>

        <main>
            <div id="view-coin" class="view active-view">
                <div class="coin-wrapper">
                    <div class="coin" id="coin">
                        <div class="side heads">H</div>
                        <div class="side tails">T</div>
                    </div>
                </div>
                <p class="status" id="coin-status">Ready to flip</p>
            </div>

            <div id="view-dice" class="view">
                <div class="scene">
                    <div class="cube" id="cube">
                        <div class="face front">1</div>
                        <div class="face back">2</div>
                        <div class="face right">3</div>
                        <div class="face left">4</div>
                        <div class="face top">5</div>
                        <div class="face bottom">6</div>
                    </div>
                </div>
                <p class="status" id="dice-status">Ready to roll</p>
            </div>

            <div id="view-picker" class="view">
                <div class="input-group">
                    <input type="text" id="picker-input" class="text-input" placeholder="Add an option..." maxlength="50">
                    <button id="picker-add-btn" class="add-btn">+</button>
                </div>
                <div class="list-area" id="options-list">
                    <div class="empty-state">
                        <div>Add at least 2 options to get started</div>
                    </div>
                </div>
                <p class="status" id="picker-status">Add options above</p>
            </div>

            <div id="view-ranker" class="view">
                <div class="input-group">
                    <input type="text" id="ranker-input" class="text-input" placeholder="Add item to rank..." maxlength="50">
                    <button id="ranker-add-btn" class="add-btn">+</button>
                </div>
                <div class="list-area" id="ranker-list">
                    <div class="empty-state">
                        <div>Add items to create your ranked list</div>
                    </div>
                </div>
                <p class="status" id="ranker-status">Drag to reorder</p>
            </div>
        </main>

        <div class="action-zone">
            <button id="main-btn">FLIP</button>
        </div>

        <nav>
            <button class="nav-item active" data-target="view-coin">Coin</button>
            <button class="nav-item" data-target="view-dice">Dice</button>
            <button class="nav-item" data-target="view-picker">Picker</button>
            <button class="nav-item" data-target="view-ranker">Ranker</button>
        </nav>
    </div>

    <div id="install-modal" class="install-modal">
        <div class="install-content">
            <div class="install-icon"><img src="images/logo192.png" alt="Arbtr"></div>
            <div class="install-text">
                <h3>Install Arbtr</h3>
                <p>Add to home screen for the best experience.</p>
            </div>
        </div>
        <div class="install-actions">
            <button id="install-dismiss" class="install-btn-secondary">Not now</button>
            <button id="install-accept" class="install-btn-primary">Install</button>
        </div>
    </div>

    <script>
        // --- PWA INSTALL ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW failed', err));
            });
        }
        let deferredPrompt;
        const installModal = document.getElementById('install-modal');
        const installBtn = document.getElementById('install-accept');
        const dismissBtn = document.getElementById('install-dismiss');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const hasRejected = localStorage.getItem('arbtr_install_rejected');
            if (hasRejected) return;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) installModal.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
            installModal.style.display = 'none';
        });

        dismissBtn.addEventListener('click', () => {
            installModal.style.display = 'none';
            localStorage.setItem('arbtr_install_rejected', 'true');
        });

        // --- APP LOGIC ---
        let mode = 'coin';
        let options = [];
        let rankedItems = [];

        const mainBtn = document.getElementById('main-btn');
        const views = {
            coin: document.getElementById('view-coin'),
            dice: document.getElementById('view-dice'),
            picker: document.getElementById('view-picker'),
            ranker: document.getElementById('view-ranker')
        };
        const statuses = {
            coin: document.getElementById('coin-status'),
            dice: document.getElementById('dice-status'),
            picker: document.getElementById('picker-status'),
            ranker: document.getElementById('ranker-status')
        };
        const navItems = document.querySelectorAll('.nav-item');

        navItems.forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelector('.nav-item.active').classList.remove('active');
                e.target.classList.add('active');
                Object.values(views).forEach(v => v.classList.remove('active-view'));
                
                const target = e.target.dataset.target;
                document.getElementById(target).classList.add('active-view');

                if (target === 'view-coin') { 
                    mode = 'coin'; 
                    mainBtn.textContent = "FLIP";
                    mainBtn.style.display = 'block';
                    statuses.coin.classList.remove('loading');
                }
                if (target === 'view-dice') { 
                    mode = 'dice'; 
                    mainBtn.textContent = "ROLL";
                    mainBtn.style.display = 'block';
                    statuses.dice.classList.remove('loading');
                }
                if (target === 'view-picker') { 
                    mode = 'picker'; 
                    mainBtn.textContent = "PICK";
                    mainBtn.style.display = 'block';
                    statuses.picker.classList.remove('loading');
                }
                if (target === 'view-ranker') { 
                    mode = 'ranker';
                    mainBtn.textContent = "RANDOMIZE";
                    mainBtn.style.display = 'block';
                }
            });
        });

        mainBtn.addEventListener('click', () => {
            mainBtn.disabled = true;
            if (mode === 'coin') doFlip();
            if (mode === 'dice') doRoll();
            if (mode === 'picker') doPick();
            if (mode === 'ranker') doRandomize();
        });

        let coinRot = 0;
        function doFlip() {
            statuses.coin.textContent = "Flipping...";
            statuses.coin.classList.add('loading');
            const isHeads = Math.random() < 0.5;
            const spins = 6;
            const target = isHeads ? 0 : 180;
            coinRot += (360 * spins) + (target - (coinRot % 360));
            document.getElementById('coin').style.transform = `rotateX(${coinRot}deg)`;
            setTimeout(() => {
                statuses.coin.textContent = isHeads ? "HEADS" : "TAILS";
                statuses.coin.classList.remove('loading');
                mainBtn.disabled = false;
            }, 1200);
        }

        function doRoll() {
            statuses.dice.textContent = "Rolling...";
            statuses.dice.classList.add('loading');
            const result = Math.floor(Math.random() * 6) + 1;
            const cube = document.getElementById('cube');
            const rotations = {
                1: [0, 0],   2: [0, 180], 3: [0, -90],
                4: [0, 90],  5: [-90, 0], 6: [90, 0]
            };
            const spinX = (Math.floor(Math.random() * 3) + 3) * 360; 
            const spinY = (Math.floor(Math.random() * 3) + 3) * 360;
            const [finalX, finalY] = rotations[result];
            cube.style.transform = `rotateX(${finalX + spinX}deg) rotateY(${finalY + spinY}deg)`;
            setTimeout(() => {
                statuses.dice.textContent = `Rolled a ${result}`;
                statuses.dice.classList.remove('loading');
                mainBtn.disabled = false;
            }, 1200);
        }

        const pickerInput = document.getElementById('picker-input');
        const optionsList = document.getElementById('options-list');
        
        function updatePickerEmptyState() {
            if (options.length === 0) {
                optionsList.innerHTML = `
                    <div class="empty-state">
                        <div>Add at least 2 options to get started</div>
                    </div>
                `;
            }
            statuses.picker.textContent = options.length === 0 ? "Add options above" : 
                                         options.length === 1 ? "Add 1 more option" : 
                                         "Ready to pick!";
        }

        function addPickerOption() {
            const val = pickerInput.value.trim();
            if (val && options.length < 20) {
                options.push(val);
                if (options.length === 1) optionsList.innerHTML = '';
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<span>${val}</span><button class="delete-btn" onclick="deletePickerOption(${options.length - 1})">✕</button>`;
                optionsList.appendChild(div);
                pickerInput.value = '';
                updatePickerEmptyState();
            }
        }
        document.getElementById('picker-add-btn').addEventListener('click', addPickerOption);
        pickerInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addPickerOption(); });

        function deletePickerOption(index) {
            options.splice(index, 1);
            renderPickerOptions();
            updatePickerEmptyState();
        }

        function renderPickerOptions() {
            if (options.length === 0) {
                updatePickerEmptyState();
                return;
            }
            optionsList.innerHTML = '';
            options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<span>${opt}</span><button class="delete-btn" onclick="deletePickerOption(${i})">✕</button>`;
                optionsList.appendChild(div);
            });
        }

        function doPick() {
            if (options.length < 2) {
                statuses.picker.textContent = "⚠️ Need at least 2 options";
                mainBtn.disabled = false;
                return;
            }
            statuses.picker.textContent = "Picking...";
            statuses.picker.classList.add('loading');
            let cycles = 0;
            const items = document.querySelectorAll('#options-list .list-item');
            let finalIndex;
            const interval = setInterval(() => {
                items.forEach(i => i.classList.remove('highlight'));
                const r = Math.floor(Math.random() * items.length);
                items[r].classList.add('highlight');
                finalIndex = r;
                cycles++;
                if (cycles > 20) {
                    clearInterval(interval);
                    items.forEach(i => i.classList.remove('highlight'));
                    items[finalIndex].classList.add('winner');
                    statuses.picker.textContent = `Winner: ${options[finalIndex]}`;
                    statuses.picker.classList.remove('loading');
                    mainBtn.disabled = false;
                    setTimeout(() => items[finalIndex].classList.remove('winner'), 2000);
                }
            }, 100);
        }

        const rankerInput = document.getElementById('ranker-input');
        const rankerList = document.getElementById('ranker-list');
        let draggedElement = null;

        function updateRankerEmptyState() {
            if (rankedItems.length === 0) {
                rankerList.innerHTML = `
                    <div class="empty-state">
                        <div>Add items to create your ranked list</div>
                    </div>
                `;
                statuses.ranker.textContent = "Add items above";
            } else {
                statuses.ranker.textContent = "Ready to randomize!";
            }
        }

        function addRankerItem() {
            const val = rankerInput.value.trim();
            if (val && rankedItems.length < 20) {
                rankedItems.push(val);
                renderRankerList();
                rankerInput.value = '';
                updateRankerEmptyState();
            }
        }
        document.getElementById('ranker-add-btn').addEventListener('click', addRankerItem);
        rankerInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addRankerItem(); });

        function deleteRankerItem(index) {
            rankedItems.splice(index, 1);
            renderRankerList();
            updateRankerEmptyState();
        }

        function renderRankerList() {
            if (rankedItems.length === 0) {
                updateRankerEmptyState();
                return;
            }
            rankerList.innerHTML = '';
            rankedItems.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'rank-item';
                div.draggable = true;
                div.dataset.index = i;
                div.innerHTML = `<span class="drag-handle">☰</span><span class="rank-number">${i + 1}</span><span class="rank-item-text">${item}</span><button class="delete-btn" onclick="deleteRankerItem(${i})">✕</button>`;
                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragover', handleDragOver);
                div.addEventListener('drop', handleDrop);
                div.addEventListener('dragend', handleDragEnd);
                rankerList.appendChild(div);
            });
        }

        function handleDragStart(e) { draggedElement = this; this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
        function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
        function handleDrop(e) {
            e.stopPropagation();
            if (draggedElement !== this) {
                const draggedIndex = parseInt(draggedElement.dataset.index);
                const targetIndex = parseInt(this.dataset.index);
                const item = rankedItems.splice(draggedIndex, 1)[0];
                rankedItems.splice(targetIndex, 0, item);
                renderRankerList();
            }
            return false;
        }
        function handleDragEnd(e) { document.querySelectorAll('.rank-item').forEach(i => i.classList.remove('dragging')); }

        function doRandomize() {
            if (rankedItems.length < 2) {
                statuses.ranker.textContent = "⚠️ Need at least 2 items";
                mainBtn.disabled = false;
                return;
            }
            statuses.ranker.textContent = "Randomizing...";
            statuses.ranker.classList.add('loading');
            let cycles = 0;
            const interval = setInterval(() => {
                for (let i = rankedItems.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [rankedItems[i], rankedItems[j]] = [rankedItems[j], rankedItems[i]];
                }
                renderRankerList();
                cycles++;
                if (cycles > 15) {
                    clearInterval(interval);
                    statuses.ranker.textContent = "Order randomized!";
                    statuses.ranker.classList.remove('loading');
                    mainBtn.disabled = false;
                }
            }, 100);
        }

        window.deletePickerOption = deletePickerOption;
        window.deleteRankerItem = deleteRankerItem;
    </script>
</body>
</html>
